services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NIVESHRAKSHA_RETENTION_HOURS=72
      - NIVESHRAKSHA_DB_PATH=/app/data/niveshraksha.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  backend-data:
