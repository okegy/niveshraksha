[project]
name = "niveshraksha-backend"
version = "1.0.0"
description = "NiveshRaksha investor-safety API — rule-based red-flag analysis, verification, privacy-first evidence drafts. Not investment advice."
requires-python = ">=3.12"
license = { file = "../LICENSE" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "BLE001", # blind except is intentional at API boundaries (fail-safe handlers)
]

[tool.ruff.lint.per-file-ignores]
# Regex patterns and user-facing rule explanations are data tables: each must
# stay on one line to remain auditable and diff-able.
"app/analyzers/*.py" = ["E501"]
"app/security/redaction.py" = ["E501"]
"app/chat/raksha_guide.py" = ["E501"]
"app/ml/corpus.py" = ["E501"]
"app/ml/classifiers.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
